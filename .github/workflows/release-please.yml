name: Release Please

# Watches main and keeps one open "release" pull request up to date: it bumps the version
# in package.json, rewrites CHANGELOG.md from Conventional Commits, and when you merge it,
# tags the commit and publishes a GitHub Release.
#
# It writes through a pull request rather than pushing to main, which is why it coexists
# with branch protection instead of fighting it. An earlier design here pushed the
# changelog straight to main and broke the moment protection was enabled.
#
# Merge the release PR when you want to cut a version. Leaving it open is fine — it keeps
# accumulating changes, and main keeps deploying regardless.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # SHA resolved 2026-07-31 via the GitHub API (list tags -> get commit), same as
      # in ci.yml.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
